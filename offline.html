<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14171A">
<title>Offline — LOGBOOK</title>
<style>
  :root{--bg:#14171A;--panel:#1C2024;--line:#2C3238;--text:#ECEEF0;--muted:#8B94A0;--amber:#F2A93B;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));
  }
  .mark{
    width:64px;height:64px;border:2px solid var(--amber);border-radius:50%;margin:0 auto 22px;
    display:flex;align-items:center;justify-content:center;
    font:600 20px ui-monospace,Menlo,Consolas,monospace;color:var(--amber);
  }
  h1{font-size:22px;margin:0 0 8px;letter-spacing:.02em;}
  p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 auto 26px;max-width:320px;}
  button{
    background:var(--amber);color:#14171A;border:none;border-radius:4px;
    padding:12px 26px;font-size:15px;font-weight:600;cursor:pointer;min-height:44px;
  }
  button:active{filter:brightness(.92);}
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">LB</div>
    <h1>You're offline</h1>
    <p>Logbook needs a connection to load and save tasks and attendance. Check your network, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    // Come back automatically the moment the connection returns.
    window.addEventListener('online', function(){ location.reload(); });
  </script>
</body>
</html>
